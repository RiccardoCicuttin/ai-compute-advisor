# Editorial source of truth for which models ai-compute-advisor tracks.
#
# Every field here except hfRepoId is copied straight from the currently
# committed public/data/models.json — this file bootstraps the seed from
# the existing catalog so the first sync run is a pure refresh, not a
# rewrite. hfRepoId is this maintainer's best-effort guess at each model's
# Hugging Face repo; a handful are cross-checked against
# llm-specs-pipeline/data/crosswalk.csv, the rest are conventional
# "org/Model-Name" guesses. A wrong guess is not a silent failure: build_catalog.py
# will fail to pull it, log it in gaps_report.txt, and keep this model's
# previous catalog entry untouched until the repo id here is corrected.
#
# To add a new tracked model: add a row with every field below filled in.
# The pipeline will never invent capabilityTierId, commercialUse,
# quantizations, or notes on your behalf.

